name: Validate Pinterest RSS Promotion Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pinterest*rss.xml'
      - 'assets/pinterest/**'
      - '*.html'
      - 'scripts/*pinterest*.py'
      - '.github/workflows/build-pinterest-rss.yml'
  pull_request:
    paths:
      - 'pinterest*rss.xml'
      - 'assets/pinterest/**'
      - '*.html'
      - 'scripts/*pinterest*.py'
      - '.github/workflows/build-pinterest-rss.yml'

permissions:
  contents: read

concurrency:
  group: pinterest-rss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all feeds and preserve previously published entries
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--live)
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            args+=(--base "$BASE")
          fi
          python3 scripts/pinterest_preflight.py "${args[@]}" 2>&1 | tee pinterest-validation.log
      - name: Retain validation errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-validation-errors
          path: pinterest-validation.log
