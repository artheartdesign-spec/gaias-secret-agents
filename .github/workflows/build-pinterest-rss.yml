name: Validate Pinterest RSS Promotion Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pinterest-rss.yml'
      - 'scripts/validate_pinterest_rss.py'
      - 'pinterest-rss.xml'
  pull_request:
    paths:
      - '.github/workflows/build-pinterest-rss.yml'
      - 'scripts/validate_pinterest_rss.py'
      - 'pinterest-rss.xml'

# pinterest-rss.xml is the source of truth. Never rebuild it from an older
# embedded list: doing so erased newly committed promotions on 30 October.
# GitHub Pages publishes the committed XML. Pinterest's RSS importer is a
# separate service and must be verified through its import status/live Pins.
permissions:
  contents: read

concurrency:
  group: pinterest-rss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate feed without modifying its content
        run: python3 scripts/validate_pinterest_rss.py pinterest-rss.xml
