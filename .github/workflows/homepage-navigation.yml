name: Keep homepage navigation and activities

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/homepage-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add customer navigation and free activities feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          nav_html = '''<div class="nav-links">
          <a href="/">Home</a>
          <a href="/screen-free-nature-activities.html">Free Activities</a>
          <a href="#recruit-kit">Starter Kit</a>
          <a href="#faq">Parents / FAQ</a>
          <a class="nav-cta" href="https://gaiassecretagents.gumroad.com/l/gsa-starter-kit">Get the Starter Kit — A$19</a>
        </div>'''

          nav_pattern = r'<div class="nav-links">[\s\S]*?</div>'
          if re.search(nav_pattern, s):
              s = re.sub(nav_pattern, nav_html, s, count=1)
          else:
              raise SystemExit('Homepage nav-links block not found; no changes made.')

          css_marker = '/* gsa-home-navigation */'
          if css_marker not in s:
              nav_css = '''
<style>
/* gsa-home-navigation */
@media (max-width: 820px){
  .nav{flex-wrap:wrap;padding:10px 0 12px;gap:10px}
  .brand{min-width:0}
  .nav-links{display:flex!important;width:100%;justify-content:center;flex-wrap:wrap;gap:8px 14px;white-space:normal}
  .nav-links a{font-size:.7rem}
  .nav-links .nav-cta{padding:8px 12px}
}
.free-activities-home{background:linear-gradient(180deg,#f6ecd7,#efe0bf);color:#15303b;padding:78px 0}
.free-activities-card{max-width:900px;margin:0 auto;border:1px solid rgba(167,125,50,.28);border-radius:28px;padding:38px;background:rgba(251,244,228,.92);box-shadow:0 18px 54px rgba(44,31,11,.12)}
.free-activities-card .eyebrow{color:#81622b}
.free-activities-card h2{color:#15303b}
.free-activities-card p{max-width:720px;margin:18px auto 0;font-size:1.05rem;line-height:1.65}
.free-activities-card .button-row{justify-content:center}
.free-activities-card .btn.secondary{color:#15303b;border-color:rgba(167,125,50,.42);background:rgba(199,154,69,.08)}
</style>
'''
              s = s.replace('</head>', nav_css + '</head>', 1)

          section_marker = 'id="free-activities-home"'
          if section_marker not in s:
              free_section = '''
<section class="free-activities-home" id="free-activities-home">
  <div class="section-inner center">
    <div class="free-activities-card">
      <p class="eyebrow dark">Free Activities</p>
      <h2>Try a field briefing before your first mission.</h2>
      <p>Explore seven simple, screen-free nature activities for children aged 6–11. They turn a backyard, park or ordinary walk into a small real-world investigation — no special equipment required.</p>
      <div class="button-row">
        <a class="btn primary" href="/screen-free-nature-activities.html">Explore 7 Free Nature Activities</a>
        <a class="btn secondary" href="#recruit-kit">See the Starter Kit</a>
      </div>
    </div>
  </div>
</section>
'''
              anchor = '<section class="section ocean" id="recruit-kit">'
              if anchor not in s:
                  raise SystemExit('Starter Kit section anchor not found; no changes made.')
              s = s.replace(anchor, free_section + '\n' + anchor, 1)

          # Use the actual FAQ section ID if the existing page uses parents instead.
          if 'id="faq"' not in s:
              for candidate in ('id="parents"', 'id="parents-faq"'):
                  if candidate in s:
                      s = s.replace('href="#faq"', 'href="#' + candidate[4:-1] + '"', 1)
                      break

          if s == original:
              print('Homepage navigation already current.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Homepage navigation and Free Activities section updated.')
          PY

      - name: Commit homepage navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage navigation changes needed."
            exit 0
          fi
          git commit -m "Add homepage navigation and Free Activities"
          git push
