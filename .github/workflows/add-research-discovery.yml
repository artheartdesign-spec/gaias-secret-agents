name: Add GSA research discovery links

on:
  push:
    paths:
      - ".github/workflows/add-research-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-research-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add evidence-informed research links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          article_url = "/why-we-make-kids-the-agents.html"

          # Homepage: add a concise credibility block without changing approved artwork.
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          original = s
          if 'id="research-behind-the-missions"' not in s:
              research_section = '''
          <section class="section parchment" id="research-behind-the-missions">
            <div class="section-inner">
              <div class="paper-panel narrow center">
                <p class="eyebrow dark">Evidence-Informed Mission Design</p>
                <h2>Why we make kids the agents.</h2>
                <p class="large-line">Children learn about nature by doing, discovering and sharing — not just by reading about it.</p>
                <p>We follow current environmental-education research on action-based storytelling, hands-on discovery and parent–child learning, then use the useful findings to strengthen how Gaia’s Secret Agents missions are designed.</p>
                <p><strong>They’re not just learning about the Earth. They have a role to play in protecting it.</strong></p>
                <div class="button-row" style="justify-content:center">
                  <a class="btn primary" href="/why-we-make-kids-the-agents.html">See the Research Behind the Missions</a>
                </div>
              </div>
            </div>
          </section>
          '''
              anchor = re.search(r'<section[^>]*id="recruit-kit"[^>]*>', s, flags=re.I)
              if anchor:
                  s = s[:anchor.start()] + research_section + s[anchor.start():]
              elif '</main>' in s:
                  s = s.replace('</main>', research_section + '</main>', 1)
              else:
                  raise SystemExit("Could not find a safe homepage insertion point")

          if article_url not in s:
              raise SystemExit("Homepage research article link was not added")
          if s != original:
              p.write_text(s, encoding="utf-8")

          # Free Guides hub: add the research article as a full-width field file.
          p = Path("free-activities-guides.html")
          s = p.read_text(encoding="utf-8")
          original = s
          if article_url not in s:
              start = s.find('<section class="guide-grid"')
              if start == -1:
                  raise SystemExit("Guide grid not found")
              end = s.find('</section>', start)
              if end == -1:
                  raise SystemExit("Guide grid closing tag not found")
              research_card = '''
      <article class="guide" style="grid-column:1/-1;min-height:330px">
        <div class="guide-top"><span class="stamp">Evidence File</span><span class="file-no">RESEARCH // AGENT-01</span></div>
        <div class="guide-body"><p class="tag">Research behind the missions</p><h3>Why We Make Kids the Agents</h3><p>See the peer-reviewed research informing GSA’s use of story, achievable action, hands-on discovery and parent–child participation.</p><a class="read" href="/why-we-make-kids-the-agents.html">Open the research briefing</a></div>
      </article>
      '''
              s = s[:end] + research_card + s[end:]
          if article_url not in s:
              raise SystemExit("Research article was not linked from the guides hub")
          if s != original:
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit research discovery links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html free-activities-guides.html
          if git diff --cached --quiet; then
            echo "Research links already present."
            exit 0
          fi
          git commit -m "Add evidence-informed research links"
          git push

# Triggered 2026-08-31
