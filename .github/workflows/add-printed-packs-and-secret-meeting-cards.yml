name: Add printed packs and Secret Meeting Cards showcase

on:
  push:
    paths:
      - ".github/workflows/add-printed-packs-and-secret-meeting-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add physical product offer and Secret Meeting Cards showcase
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          # Exact user-approved Secret Meeting Card artwork, resized only for web delivery.
          card_b64 = """"""
          asset = Path("assets/secret-meeting-card-water-treasure.jpg")
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_bytes(base64.b64decode(card_b64))

          home = Path("index.html")
          s = home.read_text(encoding="utf-8")
          original = s

          s = s.replace(
              "premium printable experience designed to feel special from the first page.",
              "premium screen-free experience available as an instant printable or a ready-printed pack by mail."
          )
          s = s.replace(
              '<div><strong>Instant download</strong><span>Print and begin at home</span></div>',
              '<div><strong>Choose your format</strong><span>Instant printable or printed pack by mail</span></div>'
          )
          s = s.replace(
              '<div><span>01</span><h3>Print the mission</h3><p>Download the materials and prepare the assignment at home.</p></div>',
              '<div><span>01</span><h3>Choose your format</h3><p>Download instantly or order a printed pack delivered by mail.</p></div>'
          )

          if 'href="/printed-packs.html"' not in s:
              nav_link = '<a href="/printed-packs.html">Printed Packs</a>'
              known = '<a href="/free-activities-guides.html">Free Activities &amp; Guides</a>'
              if known in s:
                  s = s.replace(known, known + nav_link, 1)
              else:
                  nav = re.search(r'<(?:nav|div)[^>]*class="[^"]*nav-links[^"]*"[^>]*>', s, flags=re.I)
                  if nav:
                      s = s[:nav.end()] + nav_link + s[nav.end():]

          if 'id="secret-meeting-cards-showcase"' not in s:
              block = '''<section class="gsa-meeting-showcase" id="secret-meeting-cards-showcase"><div class="gsa-meeting-shell"><div class="gsa-meeting-art"><img src="/assets/secret-meeting-card-water-treasure.jpg" alt="Gaia’s Secret Agents Secret Meeting Card: Water Treasure"></div><div class="gsa-meeting-copy"><p class="gsa-meeting-kicker">Inside the Starter Kit</p><h2>Meet the Secret Meeting Cards.</h2><p class="gsa-meeting-lead">Draw one. Talk, imagine or do it together. Secret Meeting Cards turn a few spare minutes into conversation, laughter, curiosity and real-world noticing — without another screen.</p><div class="gsa-meeting-types"><span><strong>TALK</strong> Share what you notice and remember.</span><span><strong>IMAGINE</strong> Spark stories and unexpected ideas.</span><span><strong>DO</strong> Try a small action or challenge together.</span></div><p class="gsa-meeting-note">They are a core part of the Gaia’s Secret Agents family experience and are included with the Starter Kit.</p><div class="gsa-meeting-actions"><a class="gsa-meeting-btn primary" href="https://gaiassecretagents.gumroad.com/l/gsa-starter-kit">Get the Printable Starter Kit — A$19</a><a class="gsa-meeting-btn secondary" href="/printed-packs.html">Order a Printed Pack by Mail</a></div></div></div></section><section class="gsa-format-section" id="choose-your-format"><div class="gsa-format-shell"><p class="gsa-meeting-kicker">Choose your format</p><h2>Print it yourself — or have Headquarters send it by mail.</h2><p class="gsa-format-intro">Every Gaia’s Secret Agents downloadable pack can also be ordered as a physical printed pack. Digital versions stay available for instant access; printed versions are prepared and posted to you.</p><div class="gsa-format-grid"><article><span class="gsa-format-label">Instant</span><h3>Printable Download</h3><p>Buy online, download immediately and print at home when you are ready.</p><a class="gsa-meeting-btn primary" href="https://gaiassecretagents.gumroad.com/l/gsa-starter-kit">Get the Digital Starter Kit</a></article><article><span class="gsa-format-label">By Mail</span><h3>Printed Pack</h3><p>No printer required. We print, organise and post the pack for you. Physical pack price and postage are confirmed before payment.</p><a class="gsa-meeting-btn secondary dark" href="/printed-packs.html">See Printed Pack Options</a></article></div></div></section>'''
              anchor = re.search(r'<section[^>]*id="recruit-kit"[^>]*>', s, flags=re.I)
              if not anchor:
                  raise SystemExit("Starter Kit section not found")
              s = s[:anchor.start()] + block + s[anchor.start():]

          if '/* gsa-physical-products-v1 */' not in s:
              css = '''<style>/* gsa-physical-products-v1 */
              .gsa-meeting-showcase{padding:82px 18px;background:linear-gradient(145deg,#03141f,#082d3f 65%,#0b4c52);color:#f6ecd7;border-top:1px solid rgba(226,196,116,.28);border-bottom:1px solid rgba(226,196,116,.28)}.gsa-meeting-shell{width:min(1040px,100%);margin:auto;display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(34px,6vw,72px);align-items:center}.gsa-meeting-art{text-align:center}.gsa-meeting-art img{display:block;width:min(100%,300px);height:auto;margin:auto;border-radius:18px;box-shadow:0 26px 64px rgba(0,0,0,.38);border:1px solid rgba(226,196,116,.55)}.gsa-meeting-kicker{margin:0 0 12px;color:#e2c474;font:900 .73rem/1.3 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}.gsa-meeting-copy h2,.gsa-format-shell h2{margin:0;color:#fffaf0;font:500 clamp(2.35rem,5vw,4rem)/1.02 Georgia,serif;letter-spacing:-.03em}.gsa-meeting-lead{margin:20px 0 0;max-width:690px;font:400 1.08rem/1.7 Arial,sans-serif;color:rgba(246,236,215,.9)}.gsa-meeting-types{display:grid;gap:10px;margin:24px 0}.gsa-meeting-types span{padding:13px 15px;border:1px solid rgba(226,196,116,.23);border-radius:14px;background:rgba(255,255,255,.035);font:400 .9rem/1.5 Arial,sans-serif}.gsa-meeting-types strong{color:#e2c474;margin-right:8px;letter-spacing:.08em}.gsa-meeting-note{font:400 .92rem/1.6 Arial,sans-serif;color:rgba(246,236,215,.72)}.gsa-meeting-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.gsa-meeting-btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:999px;text-decoration:none;font:900 .78rem/1 Arial,sans-serif;letter-spacing:.045em;text-align:center}.gsa-meeting-btn.primary{color:#071b25;background:linear-gradient(135deg,#c69336,#eed98f,#c89a43);box-shadow:0 10px 25px rgba(0,0,0,.2)}.gsa-meeting-btn.secondary{color:#f6ecd7;border:1px solid rgba(226,196,116,.65);background:rgba(255,255,255,.04)}.gsa-meeting-btn.secondary.dark{color:#15303b;background:#fbf4e4;border-color:rgba(126,83,18,.45)}.gsa-format-section{padding:76px 18px;background:linear-gradient(180deg,#f7edd8,#ead8b5);color:#15303b}.gsa-format-shell{width:min(1040px,100%);margin:auto;text-align:center}.gsa-format-shell .gsa-meeting-kicker{color:#81622b}.gsa-format-shell h2{color:#15303b;max-width:850px;margin:auto}.gsa-format-intro{max-width:760px;margin:18px auto 0;font:400 1.05rem/1.7 Arial,sans-serif}.gsa-format-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:32px;text-align:left}.gsa-format-grid article{padding:30px;border:1px solid rgba(126,83,18,.25);border-radius:22px;background:rgba(251,244,228,.9);box-shadow:0 16px 40px rgba(44,31,11,.1)}.gsa-format-label{color:#81622b;font:900 .7rem/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}.gsa-format-grid h3{margin:10px 0;color:#15303b;font:500 1.8rem/1.1 Georgia,serif}.gsa-format-grid p{min-height:78px;font:400 .95rem/1.65 Arial,sans-serif}.gsa-format-grid .primary{color:#071b25}.gsa-format-grid .secondary{color:#15303b}
              @media(max-width:760px){.gsa-meeting-showcase,.gsa-format-section{padding:58px 16px}.gsa-meeting-shell{grid-template-columns:1fr}.gsa-meeting-art img{width:min(78vw,280px)}.gsa-meeting-copy{text-align:center}.gsa-meeting-actions{flex-direction:column}.gsa-meeting-btn{width:100%}.gsa-format-grid{grid-template-columns:1fr}.gsa-format-grid article{text-align:center}.gsa-format-grid p{min-height:0}}
              </style>'''
              s = s.replace('</head>', css + '</head>', 1)

          home.write_text(s, encoding="utf-8")

          printed = Path("printed-packs.html")
          printed.write_text('''<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printed Packs by Mail | Gaia’s Secret Agents</title><meta name="description" content="Order Gaia’s Secret Agents printable adventures as physical printed packs delivered by mail."><meta name="robots" content="index,follow"><link rel="canonical" href="https://gaiassecretagents.com/printed-packs.html"><style>:root{--navy:#061d2d;--navy2:#092f40;--teal:#0d6f72;--gold:#c79a45;--gold2:#e2c474;--cream:#f6ecd7;--paper:#fbf4e4;--ink:#15303b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--cream),#ead9b8);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.7}.header{color:var(--cream);background:radial-gradient(circle at 82% 0%,rgba(21,148,154,.28),transparent 25rem),linear-gradient(135deg,#02131d,var(--navy2));border-bottom:1px solid rgba(226,196,116,.35)}.nav,.hero,main,.footer{width:min(980px,calc(100% - 36px));margin:auto}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand,.back{color:var(--gold2);text-decoration:none}.brand{font:700 .9rem/1 Georgia,serif;letter-spacing:.1em;text-transform:uppercase}.back{font-size:.74rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero{padding:58px 0 66px}.eyebrow{margin:0 0 10px;color:var(--gold2);font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif}h1{max-width:800px;margin:0;font-size:clamp(2.8rem,8vw,5rem);line-height:.98;letter-spacing:-.04em}.intro{max-width:760px;color:rgba(246,236,215,.88)}main{padding:48px 0 80px}.showcase{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:44px;align-items:center;padding:36px;border:1px solid rgba(199,154,69,.35);border-radius:28px;background:rgba(251,244,228,.96);box-shadow:0 24px 65px rgba(44,31,11,.13)}.showcase img{display:block;width:100%;max-width:280px;margin:auto;border-radius:18px;border:1px solid rgba(126,83,18,.4);box-shadow:0 18px 45px rgba(0,0,0,.2)}h2{margin:0;color:var(--navy);font-size:clamp(2rem,5vw,3.2rem);line-height:1.05}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;min-height:52px;padding:0 20px;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;font-size:.8rem;font-weight:900;letter-spacing:.04em;text-align:center}.btn.gold{color:#071b25;background:linear-gradient(135deg,#c69336,#eed98f,#c89a43)}.btn.navy{color:var(--cream);background:var(--navy)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.card{padding:28px;border:1px solid rgba(199,154,69,.3);border-radius:22px;background:rgba(251,244,228,.92)}.card h3{margin:0 0 8px;font-size:1.65rem}.note{margin-top:28px;padding:22px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--teal));color:var(--cream)}.note strong{color:var(--gold2)}footer{padding:34px 0;background:#03141f;color:rgba(246,236,215,.75)}.footer{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.footer a{color:var(--gold2)}@media(max-width:700px){.nav{padding:15px 0;align-items:flex-start;flex-direction:column}.showcase{grid-template-columns:1fr;padding:26px 20px}.showcase{text-align:center}.showcase img{max-width:240px}.grid{grid-template-columns:1fr}.buttons{flex-direction:column}.btn{width:100%}}</style></head><body><header class="header"><nav class="nav"><a class="brand" href="/">Gaia’s Secret Agents</a><a class="back" href="/">Return to Headquarters</a></nav><div class="hero"><p class="eyebrow">Choose your format</p><h1>Printed packs, delivered by mail.</h1><p class="intro">Every Gaia’s Secret Agents downloadable pack can also be ordered as a physical printed pack. Choose instant digital access when you want it now, or let Headquarters print, organise and post it to you.</p></div></header><main><section class="showcase"><img src="/assets/secret-meeting-card-water-treasure.jpg" alt="Gaia’s Secret Agents Secret Meeting Card: Water Treasure"><div><p class="eyebrow" style="color:#81622b">Featured inside the Starter Kit</p><h2>Secret Meeting Cards</h2><p>Draw one and everyone joins in. TALK, IMAGINE and DO prompts are designed for conversation, laughter, curiosity and family connection. They are part of the Starter Kit experience and one of the elements you can enjoy in either format.</p><div class="buttons"><a class="btn gold" href="https://gaiassecretagents.gumroad.com/l/gsa-starter-kit">Printable Starter Kit — A$19</a><a class="btn navy" href="mailto:hello@gaiassecretagents.com?subject=Printed%20GSA%20Pack%20Order&body=Hi%20Gaia%27s%20Secret%20Agents%2C%0A%0AI%27d%20like%20to%20order%20a%20printed%20pack%20by%20mail.%0A%0AProduct%3A%20%0AShipping%20country%2Fpostcode%3A%20%0A%0AThank%20you.">Order Printed Pack by Email</a></div></div></section><section class="grid"><article class="card"><p class="eyebrow" style="color:#81622b">Instant</p><h3>Printable Download</h3><p>Best if you want to start immediately. Purchase the digital product, download the files and print them yourself.</p></article><article class="card"><p class="eyebrow" style="color:#81622b">By mail</p><h3>Physical Printed Pack</h3><p>No printer required. Tell us which GSA product you want and where it will be posted. We will confirm the physical pack price and postage before you pay.</p></article></section><div class="note"><strong>Physical ordering:</strong> printed packs are currently ordered by email so postage can be calculated for your destination. You will receive the total before payment. No phone call is required.</div></main><footer><div class="footer"><span>© 2026 Gaia’s Secret Agents · Brisbane, Queensland, Australia</span><span><a href="/contact.html">Contact</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a> · <a href="/refund-policy.html">Refunds</a></span></div></footer></body></html>''', encoding="utf-8")

          # Update customer-care pages so they do not describe the business as digital-only.
          terms = Path("terms.html")
          t = terms.read_text(encoding="utf-8")
          t = t.replace("Terms for using Gaia’s Secret Agents digital products and website.", "Terms for using Gaia’s Secret Agents digital and physical products and website.")
          t = t.replace("These terms explain the website, digital-product and purchase conditions for Gaia’s Secret Agents.", "These terms explain the website, digital-product, physical-product and purchase conditions for Gaia’s Secret Agents.")
          t = t.replace("purchase a Gaia’s Secret Agents digital product", "purchase a Gaia’s Secret Agents product")
          t = t.replace('<h2>2. Digital products and delivery</h2><p>Products are supplied as digital downloads unless the product page clearly states otherwise. Product descriptions identify the included files, format, price and intended age range. Access is normally provided through Gumroad or the download method shown at checkout.</p>', '<h2>2. Digital and physical products</h2><p>Digital products are supplied as downloads through the method shown at checkout. Physical printed packs are prepared and posted to the delivery address supplied for the order. Product descriptions identify the format, price and included materials.</p><p>Physical pack availability, postage cost and any estimated dispatch timing are confirmed before payment when an order is arranged by email.</p>')
          t = t.replace('<h2>4. Prices and payment</h2><p>Prices are displayed before purchase. Payments are processed by Gumroad and are also subject to Gumroad’s applicable checkout terms and privacy practices. Gaia’s Secret Agents does not receive complete payment-card details.</p>', '<h2>4. Prices and payment</h2><p>Prices are confirmed before purchase. Digital checkout may be processed through Gumroad. Physical printed-pack orders arranged by email are quoted with applicable postage before payment. The payment method and total are stated before you pay. Gaia’s Secret Agents does not ask customers to email payment-card details.</p>')
          terms.write_text(t, encoding="utf-8")

          refund = Path("refund-policy.html")
          r = refund.read_text(encoding="utf-8")
          r = r.replace("Refund and download-support policy for Gaia’s Secret Agents digital products.", "Refund, delivery and support policy for Gaia’s Secret Agents digital and physical products.")
          r = r.replace("Clear support and refund information for Gaia’s Secret Agents printable digital products.", "Clear support and refund information for Gaia’s Secret Agents digital downloads and physical printed packs.")
          if '<h2>Physical printed packs</h2>' not in r:
              physical = '<section><h2>Physical printed packs</h2><p>If a printed pack arrives damaged, materially incomplete, incorrect, or otherwise fails to meet an applicable consumer guarantee, contact us and include the product name, order details and a description of the problem. Depending on the circumstances and applicable law, we may replace the affected item, correct the order, or provide an appropriate refund.</p><p>Change-of-mind requests for physical products are considered separately from rights you may have under law. Postage or return arrangements will be explained when we respond to your request.</p></section>'
              r = r.replace('<section><h2>Australian Consumer Law</h2>', physical + '<section><h2>Australian Consumer Law</h2>')
          refund.write_text(r, encoding="utf-8")

          contact = Path("contact.html")
          c = contact.read_text(encoding="utf-8")
          c = c.replace("Email support for Gaia’s Secret Agents products, downloads and parent or guardian enquiries.", "Email support for Gaia’s Secret Agents digital downloads, printed pack orders and parent or guardian enquiries.")
          c = c.replace('<section><h2>Purchase or download help</h2>', '<section><h2>Purchases, printed orders or download help</h2>')
          contact.write_text(c, encoding="utf-8")

          sitemap = Path("sitemap.xml")
          sm = sitemap.read_text(encoding="utf-8")
          if "printed-packs.html" not in sm:
              entry = '<url><loc>https://gaiassecretagents.com/printed-packs.html</loc></url>\n'
              sm = sm.replace('</urlset>', entry + '</urlset>')
              sitemap.write_text(sm, encoding="utf-8")
          PY

      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html printed-packs.html assets/secret-meeting-card-water-treasure.jpg contact.html terms.html refund-policy.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No site changes needed."
            exit 0
          fi
          git commit -m "Offer printed packs and showcase Secret Meeting Cards"
          git push