name: Build Free Teacher Starter Pack

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-teacher-starter-pack.py'
      - '.github/workflows/build-teacher-starter-pack.yml'

permissions:
  contents: write

concurrency:
  group: build-teacher-starter-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: pip install reportlab

      - name: Build teacher starter pack
        run: python3 scripts/build-teacher-starter-pack.py

      - name: Commit generated PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/GSA_Free_Teacher_Starter_Pack.pdf
          if git diff --cached --quiet; then
            echo 'Teacher Starter Pack already current.'
            exit 0
          fi
          git commit -m 'Build free teacher starter pack PDF'
          git pull --rebase origin main
          git push
