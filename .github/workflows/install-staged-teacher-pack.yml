name: Install Staged Illustrated Teacher Pack

on:
  workflow_dispatch:
  push:
    paths:
      - '.tmp/teacherpdf/**'
      - '.github/workflows/install-staged-teacher-pack.yml'

permissions:
  contents: write

concurrency:
  group: install-staged-teacher-pack
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reassemble illustrated teacher pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cat .tmp/teacherpdf/part_*.b64 > /tmp/teacher-pack.pdf.gz.b64
          base64 --decode /tmp/teacher-pack.pdf.gz.b64 > /tmp/teacher-pack.pdf.gz
          gzip -dc /tmp/teacher-pack.pdf.gz > downloads/GSA_Free_Teacher_Starter_Pack.pdf
          test "$(head -c 5 downloads/GSA_Free_Teacher_Starter_Pack.pdf)" = "%PDF-"
          echo "Reassembled PDF size: $(wc -c < downloads/GSA_Free_Teacher_Starter_Pack.pdf) bytes"

      - name: Commit replacement PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/GSA_Free_Teacher_Starter_Pack.pdf
          if git diff --cached --quiet; then
            echo 'Teacher Starter Pack already matches staged illustrated version.'
            exit 0
          fi
          git commit -m 'Replace teacher starter pack with illustrated final'
          git pull --rebase origin main
          git push
