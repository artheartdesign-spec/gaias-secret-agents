name: Pinterest Sandbox Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/pinterest-trigger.txt'

permissions:
  contents: write

jobs:
  pinterest-sandbox-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Pinterest sandbox board and test Pin
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          set +e
          mkdir -p .github
          RESULT_FILE=.github/pinterest-result.txt
          PUBLIC_RESULT=pinterest-demo-result.json
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ -z "${PINTEREST_ACCESS_TOKEN:-}" ]; then
            printf 'time=%s\nstatus=FAIL\nreason=missing_secret\n' "$NOW" > "$RESULT_FILE"
            jq -nc --arg time "$NOW" '{time:$time,status:"FAIL",reason:"missing_secret"}' > "$PUBLIC_RESULT"
          else
            BOARD_NAME="GSA API Test $(date -u +%Y%m%d-%H%M%S)"
            BOARD_PAYLOAD=$(jq -nc --arg name "$BOARD_NAME" '{name:$name,privacy:"PUBLIC"}')

            BOARD_CODE=$(curl --silent --show-error \
              --output /tmp/pinterest_board.json \
              --write-out "%{http_code}" \
              --request POST \
              -H "Authorization: Bearer ${PINTEREST_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data "$BOARD_PAYLOAD" \
              "https://api-sandbox.pinterest.com/v5/boards")

            BOARD_ID=$(jq -r '.id // empty' /tmp/pinterest_board.json 2>/dev/null)

            python3 - <<'PY'
          import struct, zlib, binascii
          w, h = 1000, 1500
          raw = bytearray()
          for y in range(h):
              t = y / (h - 1)
              r = int(7 + 10*t)
              g = int(31 + 28*t)
              b = int(45 + 35*t)
              raw.append(0)
              raw.extend(bytes((r, g, b)) * w)
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
          png += chunk(b'IEND', b'')
          open('/tmp/gsa-pinterest-test.png', 'wb').write(png)
          PY

            IMAGE_B64=$(base64 -w 0 /tmp/gsa-pinterest-test.png)

            if [ -n "$BOARD_ID" ] && [ "$BOARD_CODE" -ge 200 ] && [ "$BOARD_CODE" -lt 300 ]; then
              PIN_PAYLOAD=$(jq -nc \
                --arg board_id "$BOARD_ID" \
                --arg image "$IMAGE_B64" \
                '{title:"Gaia’s Secret Agents — API Test",description:"Pinterest Sandbox API test for Gaia’s Secret Agents.",link:"https://gaiassecretagents.com",board_id:$board_id,media_source:{source_type:"image_base64",content_type:"image/png",data:$image,is_standard:true}}')

              PIN_CODE=$(curl --silent --show-error \
                --output /tmp/pinterest_pin.json \
                --write-out "%{http_code}" \
                --request POST \
                -H "Authorization: Bearer ${PINTEREST_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                --data "$PIN_PAYLOAD" \
                "https://api-sandbox.pinterest.com/v5/pins")

              PIN_ID=$(jq -r '.id // empty' /tmp/pinterest_pin.json 2>/dev/null)

              if [ "$PIN_CODE" -ge 200 ] && [ "$PIN_CODE" -lt 300 ] && [ -n "$PIN_ID" ]; then
                printf 'time=%s\nstatus=PASS\nboard_http=%s\nboard_id=%s\nboard_name=%s\npin_http=%s\npin_id=%s\n' "$NOW" "$BOARD_CODE" "$BOARD_ID" "$BOARD_NAME" "$PIN_CODE" "$PIN_ID" > "$RESULT_FILE"
                jq -nc --arg time "$NOW" --arg board_http "$BOARD_CODE" --arg board_id "$BOARD_ID" --arg board_name "$BOARD_NAME" --arg pin_http "$PIN_CODE" --arg pin_id "$PIN_ID" '{time:$time,status:"PASS",environment:"Pinterest Sandbox",board_http:$board_http,board_id:$board_id,board_name:$board_name,pin_http:$pin_http,pin_id:$pin_id}' > "$PUBLIC_RESULT"
              else
                printf 'time=%s\nstatus=FAIL\nboard_http=%s\nboard_id=%s\npin_http=%s\n' "$NOW" "$BOARD_CODE" "$BOARD_ID" "$PIN_CODE" > "$RESULT_FILE"
                printf 'pin_response=' >> "$RESULT_FILE"
                tr '\n' ' ' < /tmp/pinterest_pin.json | head -c 1000 >> "$RESULT_FILE"
                printf '\n' >> "$RESULT_FILE"
                jq -nc --arg time "$NOW" --arg board_http "$BOARD_CODE" --arg board_id "$BOARD_ID" --arg pin_http "$PIN_CODE" '{time:$time,status:"FAIL",environment:"Pinterest Sandbox",board_http:$board_http,board_id:$board_id,pin_http:$pin_http,reason:"pin_create_failed"}' > "$PUBLIC_RESULT"
              fi
            else
              printf 'time=%s\nstatus=FAIL\nboard_http=%s\nreason=board_create_failed\n' "$NOW" "$BOARD_CODE" > "$RESULT_FILE"
              printf 'board_response=' >> "$RESULT_FILE"
              tr '\n' ' ' < /tmp/pinterest_board.json | head -c 1000 >> "$RESULT_FILE"
              printf '\n' >> "$RESULT_FILE"
              jq -nc --arg time "$NOW" --arg board_http "$BOARD_CODE" '{time:$time,status:"FAIL",environment:"Pinterest Sandbox",board_http:$board_http,reason:"board_create_failed"}' > "$PUBLIC_RESULT"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_FILE" "$PUBLIC_RESULT"
          git commit -m "Record Pinterest sandbox Pin test result" || true
          git push

          cat "$RESULT_FILE"
