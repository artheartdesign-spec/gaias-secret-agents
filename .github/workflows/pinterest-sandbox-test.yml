name: Pinterest Sandbox Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/pinterest-trigger.txt'

permissions:
  contents: write

jobs:
  pinterest-sandbox-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Pinterest sandbox and record result
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          set +e
          mkdir -p .github
          RESULT_FILE=.github/pinterest-result.txt
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ -z "${PINTEREST_ACCESS_TOKEN:-}" ]; then
            printf 'time=%s\nstatus=FAIL\nreason=missing_secret\n' "$NOW" > "$RESULT_FILE"
          else
            GET_CODE=$(curl --silent --show-error \
              --output /tmp/pinterest_boards.json \
              --write-out "%{http_code}" \
              -H "Authorization: Bearer ${PINTEREST_ACCESS_TOKEN}" \
              -H "Accept: application/json" \
              "https://api-sandbox.pinterest.com/v5/boards")

            BOARD_NAME="GSA API Test $(date -u +%Y%m%d-%H%M%S)"
            PAYLOAD=$(jq -nc --arg name "$BOARD_NAME" '{name:$name,privacy:"PUBLIC"}')
            POST_CODE=$(curl --silent --show-error \
              --output /tmp/pinterest_create.json \
              --write-out "%{http_code}" \
              --request POST \
              -H "Authorization: Bearer ${PINTEREST_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data "$PAYLOAD" \
              "https://api-sandbox.pinterest.com/v5/boards")

            if [ "$GET_CODE" -ge 200 ] && [ "$GET_CODE" -lt 300 ] && [ "$POST_CODE" -ge 200 ] && [ "$POST_CODE" -lt 300 ]; then
              printf 'time=%s\nstatus=PASS\nget_http=%s\npost_http=%s\nboard_name=%s\n' "$NOW" "$GET_CODE" "$POST_CODE" "$BOARD_NAME" > "$RESULT_FILE"
            else
              printf 'time=%s\nstatus=FAIL\nget_http=%s\npost_http=%s\n' "$NOW" "$GET_CODE" "$POST_CODE" > "$RESULT_FILE"
              printf 'response=' >> "$RESULT_FILE"
              tr '\n' ' ' < /tmp/pinterest_create.json | head -c 1000 >> "$RESULT_FILE"
              printf '\n' >> "$RESULT_FILE"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_FILE"
          git commit -m "Record Pinterest sandbox test result" || true
          git push

          cat "$RESULT_FILE"
