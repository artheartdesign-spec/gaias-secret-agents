name: Maintain GSA homepage sales navigation

on:
  push:
    paths:
      - ".github/workflows/build-starter-kit-homepage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep navigation and customer trust links visible
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          original = s

          current_gumroad = "https://gaiassecretagents.gumroad.com/l/gsa-starter-kit"
          old_gumroad = "https://artheartdesign.gumroad.com/l/gsa-starter-kit"
          s = s.replace(old_gumroad, current_gumroad)

          activities_url = "/screen-free-nature-activities.html"
          if activities_url not in s:
              nav_open = re.search(r'<(?:nav|div)[^>]*class="[^"]*nav-links[^"]*"[^>]*>', s, flags=re.I)
              if not nav_open:
                  raise SystemExit("Navigation container with class nav-links not found")
              link = '<a href="/screen-free-nature-activities.html">Free Activities</a>'
              s = s[:nav_open.end()] + link + s[nav_open.end():]

          if 'id="free-activities-home"' not in s:
              free_section = (
                  '<section class="free-activities-home" id="free-activities-home">'
                  '<div class="section-inner center">'
                  '<div class="free-activities-card">'
                  '<p class="eyebrow dark">Free Activities</p>'
                  '<h2>Try a field briefing before your first mission.</h2>'
                  '<p>Explore seven simple, screen-free nature activities for children aged 6–11. Turn a backyard, park or ordinary walk into a small real-world investigation — no special equipment required.</p>'
                  '<div class="button-row">'
                  '<a class="btn primary" href="/screen-free-nature-activities.html">Explore 7 Free Nature Activities</a>'
                  '<a class="btn secondary" href="#recruit-kit">See the Starter Kit</a>'
                  '</div></div></div></section>'
              )
              anchor = re.search(r'<section[^>]*id="recruit-kit"[^>]*>', s, flags=re.I)
              if not anchor:
                  raise SystemExit("Starter Kit section not found")
              s = s[:anchor.start()] + free_section + s[anchor.start():]

          if '/* gsa-home-navigation */' not in s:
              css = (
                  '<style>/* gsa-home-navigation */'
                  '.free-activities-home{background:linear-gradient(180deg,#f6ecd7,#efe0bf);color:#15303b;padding:78px 0}'
                  '.free-activities-card{max-width:900px;margin:0 auto;border:1px solid rgba(167,125,50,.28);border-radius:28px;padding:38px;background:rgba(251,244,228,.92);box-shadow:0 18px 54px rgba(44,31,11,.12)}'
                  '.free-activities-card .eyebrow{color:#81622b}'
                  '.free-activities-card h2{color:#15303b}'
                  '.free-activities-card p{max-width:720px;margin:18px auto 0;font-size:1.05rem;line-height:1.65}'
                  '.free-activities-card .button-row{justify-content:center}'
                  '.free-activities-card .btn.secondary{color:#15303b;border-color:rgba(167,125,50,.42);background:rgba(199,154,69,.08)}'
                  '@media (max-width:820px){.nav{flex-wrap:wrap;padding:10px 0 12px;gap:10px}.brand{min-width:0}.nav-links{display:flex!important;width:100%;justify-content:center;flex-wrap:wrap;gap:8px 14px;white-space:normal}.nav-links a{font-size:.7rem}.nav-links .nav-cta{padding:8px 12px}.free-activities-home{padding:54px 0}.free-activities-card{padding:28px 22px}}'
                  '</style>'
              )
              s = s.replace('</head>', css + '</head>', 1)

          # Keep customer-care and business identity signals visible.
          privacy_link = '<a href="/privacy.html">Privacy Policy</a>'
          if 'href="/contact.html"' not in s:
              if privacy_link not in s:
                  raise SystemExit("Privacy footer link not found")
              trust_links = (
                  '<a href="/contact.html">Contact</a>'
                  '<a href="/terms.html">Terms</a>'
                  '<a href="/refund-policy.html">Refunds</a>'
              )
              s = s.replace(privacy_link, privacy_link + trust_links, 1)

          if 'rel="canonical"' not in s:
              canonical = '<link rel="canonical" href="https://gaiassecretagents.com/">'
              s = s.replace('</title>', '</title>' + canonical, 1)

          if 'independent Australian children’s activity brand' not in s:
              identity_note = (
                  '<p class="gsa-independent-note" style="width:min(940px,calc(100% - 36px));'
                  'margin:18px auto 0;text-align:center;font-size:.78rem;line-height:1.5;opacity:.82">'
                  'Gaia’s Secret Agents is an independent Australian children’s activity brand '
                  'and is not affiliated with any government agency.</p>'
              )
              if '</footer>' not in s:
                  raise SystemExit("Homepage footer not found")
              s = s.replace('</footer>', identity_note + '</footer>', 1)

          if 'gsa-organization-schema' not in s:
              schema = (
                  '<script id="gsa-organization-schema" type="application/ld+json">'
                  '{"@context":"https://schema.org","@type":"Organization",'
                  '"name":"Gaia’s Secret Agents","url":"https://gaiassecretagents.com/",'
                  '"email":"hello@gaiassecretagents.com",'
                  '"address":{"@type":"PostalAddress","addressLocality":"Brisbane",'
                  '"addressRegion":"Queensland","addressCountry":"AU"},'
                  '"sameAs":["https://gaiassecretagents.gumroad.com/"]}'
                  '</script>'
              )
              s = s.replace('</head>', schema + '</head>', 1)

          if activities_url not in s:
              raise SystemExit("Free Activities link was not added")
          if current_gumroad not in s:
              raise SystemExit("Current Starter Kit checkout link is missing")
          if 'A$19' not in s:
              raise SystemExit("Starter Kit price is missing")

          if s != original:
              p.write_text(s, encoding="utf-8")
              print("Homepage navigation updated")
          else:
              print("Homepage already current")
          PY

      - name: Commit homepage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes needed."
            exit 0
          fi
          git commit -m "Maintain GSA homepage navigation and trust links"
          git push
