<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{margin:0;min-height:100%;background:#071f2d;color:#ead7a5;font-family:Georgia,serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 25%,#123f4b 0,#082633 44%,#061b28 100%)}.loading-inner{max-width:560px;border:1px solid rgba(214,177,91,.48);border-radius:18px;padding:44px 34px;background:rgba(6,24,35,.58);box-shadow:0 24px 80px rgba(0,0,0,.35)}.loading-kicker{font:700 12px/1.4 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c9a758}.loading h1{margin:12px 0 8px;font-size:clamp(30px,7vw,52px);font-weight:normal}.loading p{margin:0;color:#d8e3df;font:16px/1.6 Arial,sans-serif}.error{color:#fff}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="loading-inner"><div class="loading-kicker">Gaia’s Secret Agents</div><h1>Entering the Agency…</h1><p>Preparing the classified Starter Kit briefing.</p></div></div>
<script>
(async()=>{
  try{
    const res=await fetch('/archive/index-pre-starter-kit.html?v=20260819',{cache:'no-cache'});
    if(!res.ok) throw new Error('Archive page could not be loaded.');
    let html=await res.text();

    const patch=(re,replacement,label)=>{
      if(!re.test(html)) throw new Error('Homepage patch failed: '+label);
      html=html.replace(re,replacement);
    };

    patch(
      /<p class="lead">Gaia’s Secret Agents is a mission-based environmental subscription movement.*?<\/p>/,
      '<p class="lead">Gaia’s Secret Agents turns environmental learning into a story-led, screen-free adventure for children aged 6–11.</p>',
      'hero introduction'
    );

    patch(
      /<div class="button-row">\s*<a class="btn primary" href="#join">Join the Mission<\/a>\s*<a class="btn secondary" href="#recruit-kit">Get the Free Recruit Kit<\/a>\s*<\/div>/,
      '<div class="button-row"><a class="btn primary" href="https://artheartdesign.gumroad.com/l/gsa-starter-kit">Get the Starter Kit — A$19</a><a class="btn secondary" href="#shop">See What’s Inside</a></div>',
      'hero buttons'
    );

    patch(
      /<section class="section ocean" id="recruit-kit">[\s\S]*?<\/section>/,
      '<section class="section ocean" id="recruit-kit"><div class="section-inner narrow center"><div><p class="eyebrow">The Starter Kit</p><h2>Your first briefing starts here.</h2><p class="large-line">Everything a new agent needs to step into the world of Gaia’s Secret Agents.</p><p>A premium printable adventure built around story, environmental action, creativity, and family connection.</p><div class="button-row"><a class="btn primary" href="https://artheartdesign.gumroad.com/l/gsa-starter-kit">Get the Starter Kit — A$19</a></div></div></div></section>',
      'Starter Kit introduction'
    );

    patch(
      /<section class="section ocean" id="shop">[\s\S]*?<\/section>/,
      '<section class="section ocean" id="shop"><div class="section-inner"><div class="center narrow"><p class="eyebrow">Starter Kit</p><h2>Begin the first mission.</h2><p class="large-line">One beautifully designed printable adventure. One clear starting point for every new agent.</p></div><div class="shop-grid" style="max-width:720px;margin:32px auto 0;grid-template-columns:1fr"><div class="shop-card"><span class="seal">Recruitment File — Digital Download</span><h3>Gaia’s Secret Agents Starter Kit</h3><p>A premium printable recruitment adventure for children aged 6–11, combining story, hands-on environmental discovery, creativity, and family connection.</p><p>Print it at home, assemble the agent materials, and begin.</p><div class="price">A$19</div><a class="btn primary" href="https://artheartdesign.gumroad.com/l/gsa-starter-kit">Get the Starter Kit</a></div></div></div></section>',
      'shop'
    );

    patch(
      /<section class="section ocean" id="join">[\s\S]*?<\/section>/,
      '<section class="section ocean" id="join"><div class="section-inner center narrow"><span class="seal">Top Secret — Eyes Only</span><h2>Will you answer the call?</h2><p class="large-line">The Starter Kit is the official starting point for every new agent.</p><div class="button-row" style="justify-content:center"><a class="btn primary" href="https://artheartdesign.gumroad.com/l/gsa-starter-kit">Get the Starter Kit — A$19</a></div></div></section>',
      'final call to action'
    );

    patch(
      /<section class="section ocean" id="mission01">/,
      '<section class="section ocean" id="mission01" style="display:none">',
      'old Mission 01 section'
    );

    html=html.replaceAll('<a href="#mission01">Mission 01</a>','');
    html=html.replaceAll('<a href="#recruit-kit">Recruit Kit</a>','<a href="#recruit-kit">Starter Kit</a>');
    html=html.replaceAll('<a href="#recruit-kit">Free Recruit Kit</a>','<a href="#recruit-kit">Starter Kit</a>');
    html=html.replaceAll('Get the Free Recruit Kit','Get the Starter Kit');
    html=html.replaceAll('Free Digital Recruit Kit','The Starter Kit');

    const obsolete=['Mission 01 Digital Pack','Monthly Digital Mission Club','Physical Mission Pack','Buy Mission 01','Join Digital','Join Waitlist'];
    const left=obsolete.filter(x=>html.includes(x));
    if(left.length) throw new Error('Old product offers remain: '+left.join(', '));

    html=html.replace('</head>','<style>[href="#mission01"]{display:none!important}</style></head>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const el=document.getElementById('loading');
    if(el) el.innerHTML='<div class="loading-inner error"><div class="loading-kicker">Gaia’s Secret Agents</div><h1>Briefing unavailable</h1><p>Please refresh the page. The preserved site files have not been altered.</p></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
